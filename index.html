<div id="app"><div class="loading">Opening your locker…</div></div>
<dialog id="modal" aria-labelledby="mtitle"></dialog>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<div id="install" class="hidden" role="dialog" aria-label="Install Cabin Locker"></div>

<script>
/* ── CONFIG: paste your Apps Script web app URL (ends in /exec) between the quotes. ── */
const CONFIG = { endpoint: "https://script.google.com/macros/s/AKfycbydQ5CvsVbzGf66GIYkXTK6YZfIkg4yFOa7i3QGST7E-4CiJybH-uVn8xjedXjIC8DpYQ/exec", appName: "Cabin Locker" };
</script>

<script>
/* Shared, deterministic cash arithmetic — identical copy lives in Code.gs. */
(function(root){
 const denominations=[500,200,100,50,20,10,5,2,1];
 function empty(){return Object.fromEntries(denominations.map(d=>[d,{bundles:0,loose:0}]))}
 function total(inv,size){return denominations.reduce((s,d)=>s+d*(inv[d].bundles*size+inv[d].loose),0)}
 function validate(lines,size){
  if(!Number.isSafeInteger(size)||size<1||size>1000)throw Error('Bundle size must be 1–1,000 notes.');
  if(!Array.isArray(lines)||!lines.length||lines.length>18)throw Error('Select at least one denomination.');
  const seen=new Set();
  lines.forEach(l=>{if(!denominations.includes(l.d)||!['loose','bundles'].includes(l.unit)||!Number.isSafeInteger(l.qty)||l.qty<1||l.qty>100000)throw Error('Enter a valid whole-number quantity.');const k=l.d+':'+l.unit;if(seen.has(k))throw Error('Duplicate denomination and unit.');seen.add(k)});
 }
 function apply(inv,lines,type,size){
  validate(lines,size);if(!['in','out','opening'].includes(type))throw Error('Invalid transaction type.');
  const next=JSON.parse(JSON.stringify(inv)),opened=[];
  [...lines].sort((a,b)=>(a.unit==='bundles'?-1:1)-(b.unit==='bundles'?-1:1)).forEach(l=>{
   const slot=next[l.d];
   if(type!=='out'){slot[l.unit]+=l.qty;return}
   if(l.unit==='bundles'){if(slot.bundles<l.qty)throw Error('Not enough ₹'+l.d+' bundles.');slot.bundles-=l.qty;return}
   if(slot.loose<l.qty){const n=Math.ceil((l.qty-slot.loose)/size);if(slot.bundles<n)throw Error('Not enough ₹'+l.d+' notes.');slot.bundles-=n;slot.loose+=n*size;opened.push({d:l.d,qty:n})}
   slot.loose-=l.qty;
  });
  const amount=lines.reduce((s,l)=>s+l.d*l.qty*(l.unit==='bundles'?size:1),0);
  if(!Number.isSafeInteger(amount)||!Number.isSafeInteger(total(next,size)))throw Error('Amount is too large.');
  return {inventory:next,amount,opened};
 }
 root.Ledger={denominations,empty,total,validate,apply};
})(globalThis);
</script>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const I=(n,s=20)=>`<i data-lucide="${n}" style="width:${s}px;height:${s}px"></i>`;
const icons=()=>{try{window.lucide&&lucide.createIcons()}catch{}};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n).toLocaleString('en-IN');
const dt=t=>new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit',timeZone:'Asia/Kolkata'});
const native=typeof google!=='undefined'&&google.script&&google.script.run;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
let endpoint=native?'embedded':(CONFIG.endpoint||localStorage.getItem('lockerEndpoint')||'');
let token=localStorage.getItem('lockerSession')||'',user=null,meta=null,view='overview',state=null,syncing=false,lastSync=null,syncError='',filter='all',search='';
let hideBalance=localStorage.getItem('lockerHide')==='1';
let pending=JSON.parse(localStorage.getItem('lockerPending')||'null');
let entry=null,saving=false,authWho='owner';
const demo=()=>!endpoint;
const TYPE_LABEL={in:'Cash added',out:'Cash taken out',opening:'Opening cash count'};

function sample(){let inv=Ledger.empty();const tx=[];const add=(type,lines,note,actor,h)=>{const before=Ledger.total(inv,100),r=Ledger.apply(inv,lines,type,100);inv=r.inventory;tx.push({id:crypto.randomUUID(),type,lines,note,actor,amount:r.amount,before,after:Ledger.total(inv,100),opened:r.opened,time:new Date(Date.now()-h*3600000).toISOString()})};
 add('opening',[{d:500,unit:'bundles',qty:1},{d:500,unit:'loose',qty:20},{d:200,unit:'loose',qty:25},{d:100,unit:'bundles',qty:1},{d:100,unit:'loose',qty:20},{d:50,unit:'loose',qty:15}],'Opening cash count','Mujahid',50);
 add('in',[{d:500,unit:'loose',qty:20}],'Cash added','Father',20);add('out',[{d:500,unit:'loose',qty:4}],'Office expenses','Mujahid',4);add('out',[{d:500,unit:'loose',qty:1}],'Courier payment','Father',1);
 return {inventory:inv,transactions:tx,bundleSize:100,version:tx.length,sheetUrl:null}}

function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),4200)}

async function api(action,data={}){
 if(native)return new Promise((res,rej)=>{const timer=setTimeout(()=>rej(Error('No confirmation received. Check the connection and retry the same entry.')),40000);google.script.run.withSuccessHandler(r=>{clearTimeout(timer);r.ok?res(r.data):rej(Error(r.error))}).withFailureHandler(e=>{clearTimeout(timer);rej(Error(e.message||'Connection failed.'))}).api({action,token,...data})});
 const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),40000);
 try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...data}),redirect:'follow',signal:ctl.signal,credentials:'omit'});
  if(!r.ok)throw Error('Google connection failed. Please try again.');let j;try{j=await r.json()}catch{throw Error('Check the web app URL and that access is set to Anyone.')}
  if(!j.ok)throw Error(j.error);return j.data}
 catch(e){if(e.name==='AbortError')throw Error('No confirmation received. Check the connection and retry the same entry.');if(e instanceof TypeError)throw Error('You appear to be offline. Balance shown may be out of date.');throw e}
 finally{clearTimeout(timer)}}

async function derive(password,username){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(meta.salt+':'+username),iterations:600000,hash:'SHA-256'},key,256);return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ── Entry flow ── */
function currentLines(){const map=new Map();[...(entry.cart||[]),...(entry.qty>0?[{d:entry.d,unit:entry.unit,qty:entry.qty}]:[])].forEach(l=>{const k=l.d+':'+l.unit;map.set(k,{...l,qty:(map.get(k)?.qty||0)+l.qty})});return [...map.values()]}
function openEntry(type,preset){
 if(pending){toast('Confirm the pending entry first.');return}
 if(type==='opening'&&state.transactions.length)type='in';
 if(type==='in'&&!state.transactions.length)type='opening';
 entry={type,d:500,unit:'loose',qty:1,cart:[],note:'',version:state.version,id:crypto.randomUUID(),...(preset||{})};
 drawEntry();
}
function drawEntry(){
 const t=entry.type,avail=d=>state.inventory[d].bundles*state.bundleSize+state.inventory[d].loose;
 modal(t==='out'?'Take out cash':t==='opening'?'Opening cash count':'Add cash',`
 <div><span class="lbl">Denomination</span><div class="dens">${Ledger.denominations.map(d=>`<button class="den-btn ${entry.d===d?'on':''}" data-den="${d}"><b>₹${d}</b><small>${avail(d)} in drawer</small></button>`).join('')}</div></div>
 <div><span class="lbl">Count as</span><div class="seg"><button data-unit="loose" class="${entry.unit==='loose'?'on':''}">${entry.d<10?'Loose coins':'Loose notes'}</button><button data-unit="bundles" class="${entry.unit==='bundles'?'on':''}">Bundles × ${state.bundleSize}</button></div></div>
 <div><label class="lbl" for="qty">Quantity</label><div class="stepper"><button id="less" aria-label="Decrease">−</button><input id="qty" type="number" inputmode="numeric" min="0" max="100000" step="1" value="${entry.qty}"><button id="more" aria-label="Increase">+</button></div>
 <div class="chips" style="margin-top:10px">${[1,5,10,20,50,100].map(n=>`<button class="chip" data-qty="${n}">${n}</button>`).join('')}</div></div>
 <div class="preview"><span id="formula"></span><strong id="lineAmt"></strong></div>
 <button class="textbtn" id="addLine">${I('plus')} Add another denomination</button>
 ${entry.cart.length?`<div class="cart">${entry.cart.map((l,i)=>`<div class="cartrow"><span>₹${l.d} × ${l.qty} ${l.unit==='bundles'?'bundles':(l.d<10?'coins':'notes')}</span><b>${money(l.d*l.qty*(l.unit==='bundles'?state.bundleSize:1))}</b><button data-remove="${i}" aria-label="Remove">${I('x')}</button></div>`).join('')}</div>`:''}
 <div><label class="lbl" for="note">Note <span class="muted" style="font-weight:400">(optional)</span></label><input class="field" id="note" maxlength="160" placeholder="e.g. Office expenses" value="${esc(entry.note)}"></div>
 <div class="notice hidden" id="bundleNotice">${I('alert-circle')}<span id="bundleText"></span></div>
 <div class="error hidden" id="entryError"></div>
 <div class="summary"><div><span class="muted">Entry total</span><b id="entryTotal">—</b></div><div><span class="muted">Balance after</span><b id="afterTotal">—</b></div></div>
 <button class="btn ${t==='out'?'':'primary'} full" id="save">${t==='out'?'Confirm take out':t==='opening'?'Save opening count':'Confirm add cash'}</button>`);
 $$('[data-den]').forEach(b=>b.onclick=()=>{entry.d=+b.dataset.den;drawEntry()});
 $$('[data-unit]').forEach(b=>b.onclick=()=>{entry.unit=b.dataset.unit;$$('[data-unit]').forEach(x=>x.classList.toggle('on',x===b));updateEntry()});
 $('#qty').oninput=e=>{entry.qty=e.target.value===''?0:parseInt(e.target.value,10);updateEntry()};
 $('#less').onclick=()=>{entry.qty=Math.max(0,(entry.qty||0)-1);$('#qty').value=entry.qty;updateEntry()};
 $('#more').onclick=()=>{entry.qty=(entry.qty||0)+1;$('#qty').value=entry.qty;updateEntry()};
 $$('[data-qty]').forEach(b=>b.onclick=()=>{entry.qty=+b.dataset.qty;$('#qty').value=entry.qty;updateEntry()});
 $('#addLine').onclick=()=>{if(!(entry.qty>0)){toast('Enter a quantity first.');return}const k=entry.d+':'+entry.unit,ex=entry.cart.find(l=>l.d+':'+l.unit===k);if(ex)ex.qty+=entry.qty;else entry.cart.push({d:entry.d,unit:entry.unit,qty:entry.qty});entry.qty=0;drawEntry()};
 $$('[data-remove]').forEach(b=>b.onclick=()=>{entry.cart.splice(+b.dataset.remove,1);drawEntry()});
 $('#note').oninput=e=>entry.note=e.target.value;
 $('#save').onclick=saveEntry;
 updateEntry();
}
function updateEntry(){
 const q=entry.qty||0,amt=entry.d*q*(entry.unit==='bundles'?state.bundleSize:1);
 $('#formula').textContent=`₹${entry.d} × ${q} ${entry.unit==='bundles'?'bundles × '+state.bundleSize:entry.d<10?'coins':'notes'}`;$('#lineAmt').textContent=money(amt);
 const lines=currentLines();$('#entryError').classList.add('hidden');$('#bundleNotice').classList.add('hidden');
 try{if(!Number.isSafeInteger(q)||q<0)throw Error('Enter a whole-number quantity.');const r=Ledger.apply(state.inventory,lines,entry.type,state.bundleSize);
  $('#entryTotal').textContent=money(r.amount);$('#afterTotal').textContent=money(Ledger.total(r.inventory,state.bundleSize));$('#save').disabled=false;
  if(r.opened.length){$('#bundleText').textContent='Open '+r.opened.map(x=>`${x.qty} bundle${x.qty>1?'s':''} of ₹${x.d}`).join(', ')+'. Remaining notes will be counted as loose.';$('#bundleNotice').classList.remove('hidden')}}
 catch(e){$('#entryTotal').textContent=money(lines.reduce((s,l)=>s+l.d*l.qty*(l.unit==='bundles'?state.bundleSize:1),0));$('#afterTotal').textContent='—';$('#save').disabled=true;$('#entryError').textContent=e.message;$('#entryError').classList.remove('hidden')}
}
async function saveEntry(){
 if(saving)return;const data={id:entry.id,type:entry.type,lines:currentLines(),note:entry.note.trim(),version:entry.version,who:user?.id};
 saving=true;const b=$('#save');b.disabled=true;b.textContent='Saving…';
 try{
  if(demo()){const before=Ledger.total(state.inventory,state.bundleSize),r=Ledger.apply(state.inventory,data.lines,data.type,state.bundleSize);state.inventory=r.inventory;state.transactions.push({...data,actor:user?.name||'Mujahid',time:new Date().toISOString(),amount:r.amount,before,after:Ledger.total(r.inventory,state.bundleSize),opened:r.opened});state.version++}
  else{pending=data;localStorage.setItem('lockerPending',JSON.stringify(pending));await sendPending()}
  $('#modal').close();render();toast(demo()?'Sample entry recorded':'Saved to Google Sheets')
 }catch(e){$('#modal').close();syncError=e.message;render();toast(e.message)}finally{saving=false}
}
async function sendPending(){
 if(pending.who&&pending.who!==user?.id)throw Error('Sign in with the account that created this pending entry.');
 try{state=await api('transact',pending);pending=null;localStorage.removeItem('lockerPending');lastSync=new Date();syncError=''}
 catch(e){if(e.message.startsWith('REJECTED:')){pending=null;localStorage.removeItem('lockerPending');try{state=await api('state')}catch{}throw Error(e.message.replace('REJECTED: ',''))}throw e}
}
async function retryPending(){if(!pending||saving)return;saving=true;try{await sendPending();render();toast('Entry confirmed.')}catch(e){syncError=e.message;render();toast(e.message)}finally{saving=false}}
async function refresh(){
 if(demo()){toast('Sample balance is up to date.');return}
 if(syncing||!token||$('#modal').open)return;syncing=true;
 try{state=await api('state');lastSync=new Date();syncError='';if(pending&&state.transactions.some(t=>t.id===pending.id)){pending=null;localStorage.removeItem('lockerPending')}if(!$('#modal').open)render()}
 catch(e){syncError=e.message;if(e.message==='Please sign in again.'){token='';localStorage.removeItem('lockerSession');state=null;auth()}else if(!$('#modal').open)render()}
 finally{syncing=false}
}
function detail(id){
 const t=state.transactions.find(t=>t.id===id);if(!t)return;
 modal('Entry details',`<p class="muted small">${dt(t.time)} · ${esc(t.actor)}</p>
 <div class="money ${t.type==='out'?'neg':'pos'}" style="font-size:36px">${t.type==='out'?'−':'+'}${money(t.amount)}</div>
 <p>${esc(t.note||TYPE_LABEL[t.type])}</p>
 <div class="cart">${t.lines.map(l=>`<div class="cartrow"><span>₹${l.d} × ${l.qty} ${l.unit==='bundles'?'bundles × '+state.bundleSize:(l.d<10?'coins':'notes')}</span><b>${money(l.d*l.qty*(l.unit==='bundles'?state.bundleSize:1))}</b></div>`).join('')}</div>
 <div class="summary"><div><span class="muted">Previous balance</span><b>${money(t.before)}</b></div><div><span class="muted">New balance</span><b>${money(t.after)}</b></div></div>
 ${t.opened?.length?`<div class="notice">${I('alert-circle')}<span>${t.opened.map(x=>`${x.qty} bundle(s) of ₹${x.d} opened; remaining notes counted as loose.`).join(' ')}</span></div>`:''}
 ${t.type!=='opening'?`<button class="btn ghost full" id="reverse">${I('undo-2',18)} Record reversal</button>`:''}
 <p class="helper">Reference ${esc(t.id.slice(0,8))}</p>`);
 const r=$('#reverse');if(r)r.onclick=()=>{$('#modal').close();openEntry(t.type==='in'?'out':'in',{cart:t.lines.map(l=>({...l})),qty:0,note:('Reversal: '+(t.note||TYPE_LABEL[t.type])).slice(0,160)})}
}
function exportCSV(){
 const csv=[['ID','Date (UTC)','Person','Type','Note','Amount INR','Previous balance INR','New balance INR','Denominations','Bundles opened'],...state.transactions.map(t=>[t.id,t.time,t.actor,t.type,t.note,t.amount,t.before,t.after,t.lines.map(l=>`${l.d} x ${l.qty} ${l.unit}`).join('; '),(t.opened||[]).map(o=>`${o.d} x ${o.qty}`).join('; ')])].map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@\-]/,"' $&").replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'})),a=document.createElement('a');a.href=url;a.download=(demo()?'DEMO-':'')+'locker-'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)
}

 <div class="error hidden" id="epErr"></div><button class="btn primary full" id="epGo">Connect</button>
 ${endpoint&&!CONFIG.endpoint?'<button class="textbtn" id="epClear">Disconnect and use sample data</button>':''}`);
 $('#epGo').onclick=async()=>{const url=$('#ep').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)){$('#epErr').textContent='Paste the full /exec address from Apps Script.';$('#epErr').classList.remove('hidden');return}
  const old=endpoint;endpoint=url;$('#epGo').disabled=true;$('#epGo').textContent='Checking…';
  try{meta=await api('info');localStorage.setItem('lockerEndpoint',url);token='';localStorage.removeItem('lockerSession');$('#modal').close();toast('Connected to Google.');start()}
  catch(e){endpoint=old;$('#epErr').textContent=e.message;$('#epErr').classList.remove('hidden');$('#epGo').disabled=false;$('#epGo').textContent='Connect'}};
 const c=$('#epClear');if(c)c.onclick=()=>{endpoint='';localStorage.removeItem('lockerEndpoint');token='';localStorage.removeItem('lockerSession');$('#modal').close();start()};
}

/* ── Start / auth ── */
async function start(){
 if(demo()){state=sample();user={id:'owner',name:'Mujahid'};render();return}
 $('#app').innerHTML='<div class="loading">Opening your locker…</div>';
 try{meta=await api('info');
  if(token){try{const r=await api('resume');state=r.state;user=r.user;lastSync=new Date();render();return}catch{token='';localStorage.removeItem('lockerSession')}}
  auth()}
 catch(e){$('#app').innerHTML=`<div class="auth">${logo()}<div class="card section-card group"><h1 class="disp">Couldn’t connect</h1><div class="error">${esc(e.message)}</div><button class="btn full" id="again">Try again</button>${native?'':'<button class="textbtn" id="chg">Change connection</button>'}</div></div>`;icons();$('#again').onclick=start;const c=$('#chg');if(c)c.onclick=connectModal}
}
function auth(){
 const init=meta.initialized;
 $('#app').innerHTML=`<div class="auth">${logo()}<div><h1 class="disp">${init?'Welcome back':'Set up your locker'}</h1><p class="muted small" style="margin-top:6px">${init?'Choose your account and enter your password.':'Create separate logins for you and your father. The cash sheet starts at zero.'}</p></div>
 <form id="authForm" class="group" autocomplete="off">
 ${init?`<div class="who">${['owner','father'].map(w=>`<button type="button" data-who="${w}" class="${authWho===w?'on':''}"><span class="av">${esc(meta.names[w].slice(0,2).toUpperCase())}</span><b>${esc(meta.names[w])}</b></button>`).join('')}</div>
 <div><label class="lbl" for="pw">Password</label><input class="field" id="pw" type="password" required autocomplete="current-password"></div>`
 :`<div><label class="lbl" for="setupKey">Setup key (from the Apps Script execution log)</label><input class="field" id="setupKey" type="password" required></div>
 <div><label class="lbl" for="ownerName">Your name</label><input class="field" id="ownerName" value="Mujahid" maxlength="40" required></div>
 <div><label class="lbl" for="pw">Your password (12+ characters)</label><input class="field" id="pw" type="password" minlength="12" required autocomplete="new-password"></div>
 <div><label class="lbl" for="fatherName">Father’s name</label><input class="field" id="fatherName" value="Father" maxlength="40" required></div>
 <div><label class="lbl" for="fpw">Father’s password (12+ characters)</label><input class="field" id="fpw" type="password" minlength="12" required autocomplete="new-password"></div>
 <div><label class="lbl" for="bundleSize">Notes in one bundle</label><input class="field" id="bundleSize" type="number" min="1" max="1000" step="1" value="100" required><p class="helper" style="margin-top:6px">Fixed after the first entry. Count your actual bundles before choosing.</p></div>`}
 <div class="error hidden" id="authErr"></div>
 <button class="btn primary full" type="submit" id="authGo">${init?'Sign in':'Create locker'}</button>
 ${init?'<button type="button" class="textbtn" id="recover" style="align-self:center">Forgot password?</button>':''}
 </form>
 ${native?'':'<button type="button" class="textbtn" id="chg" style="align-self:center;color:var(--g500)">Change connection</button>'}
 <p class="helper" style="text-align:center">Your cash records stay in your private Google Sheet.</p></div>`;
 icons();
 $$('[data-who]').forEach(b=>b.onclick=()=>{authWho=b.dataset.who;$$('[data-who]').forEach(x=>x.classList.toggle('on',x===b))});
 const chg=$('#chg');if(chg)chg.onclick=connectModal;const rec=$('#recover');if(rec)rec.onclick=recoveryModal;
 $('#authForm').onsubmit=async e=>{e.preventDefault();const b=$('#authGo'),err=$('#authErr');b.disabled=true;b.textContent='Verifying…';err.classList.add('hidden');
  try{
   if(!init){const pw=$('#pw').value,fpw=$('#fpw').value;if(pw===fpw)throw Error('Use two different passwords.');const bundleSize=parseInt($('#bundleSize').value,10);
    await api('initialize',{setupKey:$('#setupKey').value.trim(),ownerName:$('#ownerName').value,fatherName:$('#fatherName').value,bundleSize,ownerKey:await derive(pw,'owner'),fatherKey:await derive(fpw,'father')});
    meta=await api('info');toast('Locker created. Sign in to continue.');auth();return}
   const r=await api('login',{who:authWho,key:await derive($('#pw').value,authWho)});
   token=r.token;localStorage.setItem('lockerSession',token);user=r.user;state=r.state;lastSync=new Date();view='overview';render();
  }catch(ex){err.textContent=ex.message;err.classList.remove('hidden');b.disabled=false;b.textContent=init?'Sign in':'Create locker'}};
}
function passwordModal(){
 modal('Change password',`<form id="pf" class="group"><div><label class="lbl" for="op">Current password</label><input class="field" id="op" type="password" required autocomplete="current-password"></div><div><label class="lbl" for="np">New password (12+ characters)</label><input class="field" id="np" type="password" minlength="12" required autocomplete="new-password"></div><div><label class="lbl" for="cp">Confirm new password</label><input class="field" id="cp" type="password" minlength="12" required autocomplete="new-password"></div><div class="error hidden" id="pfErr"></div><button class="btn primary full" id="pfGo">Update password</button></form>`);
 $('#pf').onsubmit=async e=>{e.preventDefault();try{if($('#np').value!==$('#cp').value)throw Error('New passwords do not match.');$('#pfGo').disabled=true;await api('changePassword',{oldKey:await derive($('#op').value,user.id),newKey:await derive($('#np').value,user.id)});$('#modal').close();token='';state=null;localStorage.removeItem('lockerSession');auth();toast('Password changed. Please sign in again.')}catch(ex){$('#pfErr').textContent=ex.message;$('#pfErr').classList.remove('hidden');$('#pfGo').disabled=false}}
}
function recoveryModal(){
 modal('Recover a password',`<p class="helper">The Google account owner first runs <b>createOwnerRecovery_</b> or <b>createFatherRecovery_</b> in Apps Script. The key shown there works once and expires in 15 minutes.</p><form id="rf" class="group"><div><label class="lbl" for="rw">Account</label><select class="field" id="rw"><option value="owner">${esc(meta.names.owner)}</option><option value="father">${esc(meta.names.father)}</option></select></div><div><label class="lbl" for="rk">Recovery key</label><input class="field" id="rk" type="password" required></div><div><label class="lbl" for="rp">New password (12+ characters)</label><input class="field" id="rp" type="password" minlength="12" required autocomplete="new-password"></div><div><label class="lbl" for="rc">Confirm new password</label><input class="field" id="rc" type="password" minlength="12" required></div><div class="error hidden" id="rfErr"></div><button class="btn primary full" id="rfGo">Reset password</button></form>`);
 $('#rf').onsubmit=async e=>{e.preventDefault();try{if($('#rp').value!==$('#rc').value)throw Error('New passwords do not match.');$('#rfGo').disabled=true;const who=$('#rw').value;await api('recoverPassword',{who,recoveryKey:$('#rk').value,newKey:await derive($('#rp').value,who)});$('#modal').close();token='';localStorage.removeItem('lockerSession');auth();toast('Password reset. Sign in with the new password.')}catch(ex){$('#rfErr').textContent=ex.message;$('#rfErr').classList.remove('hidden');$('#rfGo').disabled=false}}
}
async function logout(){if(pending&&pending.who===user?.id){toast('Confirm the pending entry before signing out.');return}try{await api('logout')}catch{}token='';state=null;user=null;localStorage.removeItem('lockerSession');auth()}

/* ── Install as app (PWA) ── */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;scheduleInstall()});
window.addEventListener('appinstalled',()=>{hideInstall();toast('Installed. Open Cabin Locker from your apps.');if(view==='settings'&&state)render()});
let installTimer=null;
function scheduleInstall(){if(standalone()||native)return;const snoozed=+localStorage.getItem('lockerInstallSnooze')||0;if(Date.now()<snoozed)return;if(!$('#install').classList.contains('hidden')){showInstall();return}clearTimeout(installTimer);installTimer=setTimeout(showInstall,5000)}
function showInstall(){
 if(standalone()||native)return;const el=$('#install');
 el.innerHTML=`<img src="icons/icon-192.png" alt=""><div class="t"><b>Install Cabin Locker</b><p>${deferredPrompt?'Add it to your phone. Opens like an app.':isIOS?'Tap Share, then “Add to Home Screen”.':'Tap Chrome menu ⋮, then “Install app” or “Add to Home screen”.'}</p></div>${deferredPrompt?`<button class="btn primary" id="instGo">Install</button>`:''}<button class="x" id="instX" aria-label="Not now">${I('x',18)}</button>`;
 el.classList.remove('hidden');icons();
 const g=$('#instGo');if(g)g.onclick=doInstall;$('#instX').onclick=()=>{localStorage.setItem('lockerInstallSnooze',Date.now()+3*86400000);hideInstall()};
}
function hideInstall(){$('#install').classList.add('hidden')}
async function doInstall(){if(!deferredPrompt){showInstall();return}const p=deferredPrompt;deferredPrompt=null;hideInstall();try{await p.prompt();await p.userChoice}catch{}if(view==='settings'&&state)render()}
/* Show the install bar 5 s after opening. If Chrome's own install event arrives, the bar gets a one-tap Install button; otherwise it shows the menu steps. */
scheduleInstall();
if('serviceWorker'in navigator&&!native&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

$('#modal').addEventListener('cancel',e=>{if(saving)e.preventDefault()});
setInterval(()=>{if(!document.hidden&&!demo()&&token)refresh()},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!demo()&&token)refresh()});
window.addEventListener('online',()=>{if(!demo()&&token)refresh()});
start();
</script>
</body>
</html>
